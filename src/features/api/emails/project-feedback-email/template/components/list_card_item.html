<div
  style="
    box-sizing: border-box;
    border: 2px solid #e5e7eb;
    margin-bottom: 16px;
    margin-top: 0;
    display: block;
    height: max-content;
    width: 100%;
    border-radius: 12px;
    padding: 8px;
  "
>
  <p
    style="
      box-sizing: border-box;
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 700;
    "
  >
    [[label]]
  </p>
  <span style="box-sizing: border-box; margin-top: 8px; font-size: 16px">
    [[text]]
  </span>
</div>
